services:
  central-auth-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: central-auth-mcp
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    volumes:
      # Persist RSA 2048 keypair across container restarts so static tokens stay valid
      - mcp_keys:/app/.keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mcp_keys:
    name: central_auth_mcp_keys
